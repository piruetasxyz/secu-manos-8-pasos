<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>secu-manos-8-pasos</title>
  <script src="bibliotecas/p5.min.js"></script>
  <script src="bibliotecas/ml5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      color: #000;
      font-family: monospace;
      font-size: 16px;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: normal;
      text-transform: uppercase;
      border-bottom: 4px solid #000;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    #lienzo {
      max-width: 960px;
      border: 4px solid #000;
      background: #000;
      line-height: 0;
    }

    #lienzo canvas {
      display: block;
    }

    #pasos {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      max-width: 960px;
      margin-top: 8px;
    }

    #pasos button {
      font: inherit;
      aspect-ratio: 1;
      background: #000;
      color: #fff;
      border: 4px solid #000;
      cursor: pointer;
    }

    #pasos button[aria-pressed="true"] {
      background: #fff;
      color: #000;
    }

    #pasos button:focus-visible,
    #deteccion:focus-visible {
      outline: 4px solid #f00;
      outline-offset: -8px;
    }

    body.con-deteccion #pasos button {
      cursor: default;
    }

    #controles {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }

    #deteccion {
      font: inherit;
      text-transform: uppercase;
      background: #000;
      color: #fff;
      border: 4px solid #000;
      padding: 8px 16px;
      cursor: pointer;
    }

    #deteccion[aria-pressed="true"] {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body class="con-deteccion">
  <h1>secu-manos-8-pasos</h1>

  <div id="lienzo"></div>

  <div id="pasos"></div>

  <div id="controles">
    <button id="deteccion" aria-pressed="true">manos: sí</button>
    <p id="estado">esperando cámara</p>
  </div>

  <script>
    // modelos locales de handpose
    const opcionesManos = {
      runtime: "tfjs",
      modelType: "full",
      maxHands: 2,
      flipped: false,
      detectorModelUrl: "modelos/handpose/detector-full/model.json",
      landmarkModelUrl: "modelos/handpose/landmark-full/model.json",
    };

    // índices de keypoints de handpose para cada dedo, sin pulgar
    const dedos = [
      { nudillo: 5, medio: 6, punta: 8 },    // índice
      { nudillo: 9, medio: 10, punta: 12 },  // medio
      { nudillo: 13, medio: 14, punta: 16 }, // anular
      { nudillo: 17, medio: 18, punta: 20 }, // meñique
    ];

    // dedo extendido si (muñeca→punta) / (muñeca→medio) supera umbralSubir,
    // escondido si baja de umbralBajar; entre ambos mantiene su estado
    const umbralSubir = 1.25;
    const umbralBajar = 1.1;

    const cantidadPasos = 8;
    const estadoPasos = new Array(cantidadPasos).fill(false);

    const contenedorPasos = document.getElementById("pasos");
    const botonDeteccion = document.getElementById("deteccion");
    const estado = document.getElementById("estado");
    const botonesPasos = [];

    let deteccionActiva = true;
    let video;
    let detectorManos;
    let manos = [];
    let marcas = [];

    for (let i = 0; i < cantidadPasos; i++) {
      const boton = document.createElement("button");
      boton.textContent = i + 1;
      boton.setAttribute("aria-pressed", "false");
      boton.addEventListener("click", () => {
        if (deteccionActiva) return;
        estadoPasos[i] = !estadoPasos[i];
        actualizarBotones();
      });
      contenedorPasos.appendChild(boton);
      botonesPasos.push(boton);
    }

    botonDeteccion.addEventListener("click", () => {
      deteccionActiva = !deteccionActiva;
      botonDeteccion.setAttribute("aria-pressed", String(deteccionActiva));
      botonDeteccion.textContent = deteccionActiva ? "manos: sí" : "manos: no";
      document.body.classList.toggle("con-deteccion", deteccionActiva);
      if (!deteccionActiva) marcas = [];
    });

    function actualizarBotones() {
      botonesPasos.forEach((boton, i) => {
        boton.setAttribute("aria-pressed", String(estadoPasos[i]));
      });
    }

    function distancia(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // convierte las manos detectadas en los 8 pasos, de izquierda a derecha en pantalla
    function leerPasos(anchoVideo) {
      const espejo = (p) => ({ x: anchoVideo - p.x, y: p.y });
      const manosEnPantalla = manos
        .map((mano) => mano.keypoints.map(espejo))
        .sort((a, b) => a[0].x - b[0].x);

      // ranura 0 = pasos 1-4, ranura 1 = pasos 5-8
      let ranuras = [null, null];
      if (manosEnPantalla.length >= 2) {
        ranuras = [manosEnPantalla[0], manosEnPantalla[1]];
      } else if (manosEnPantalla.length === 1) {
        const puntos = manosEnPantalla[0];
        ranuras[puntos[0].x < anchoVideo / 2 ? 0 : 1] = puntos;
      }

      marcas = [];
      ranuras.forEach((puntos, ranura) => {
        if (!puntos) {
          for (let d = 0; d < dedos.length; d++) estadoPasos[ranura * 4 + d] = false;
          return;
        }
        const muneca = puntos[0];
        const dedosEnPantalla = [...dedos].sort((a, b) => puntos[a.nudillo].x - puntos[b.nudillo].x);
        dedosEnPantalla.forEach((dedo, d) => {
          const paso = ranura * 4 + d;
          const proporcion = distancia(muneca, puntos[dedo.punta]) / distancia(muneca, puntos[dedo.medio]);
          if (proporcion > umbralSubir) estadoPasos[paso] = true;
          else if (proporcion < umbralBajar) estadoPasos[paso] = false;
          marcas.push({ x: puntos[dedo.punta].x, y: puntos[dedo.punta].y, paso });
        });
      });

      actualizarBotones();
    }

    async function setup() {
      const contenedor = document.getElementById("lienzo");
      const lienzo = createCanvas(contenedor.clientWidth, contenedor.clientWidth * 3 / 4);
      lienzo.parent(contenedor);
      textFont("monospace");
      textAlign(CENTER, CENTER);

      video = createCapture(VIDEO);
      video.hide();

      estado.textContent = "cargando modelo de manos";
      try {
        detectorManos = await ml5.handPose(opcionesManos);
        detectorManos.detectStart(video, (resultados) => {
          manos = resultados;
        });
        estado.textContent = "listo";
      } catch (error) {
        estado.textContent = "error de modelo: " + error.message;
      }
    }

    function draw() {
      background(0);

      const anchoVideo = video.elt.videoWidth;
      const altoVideo = video.elt.videoHeight;
      if (!anchoVideo) return;

      const altoDeseado = Math.round(width * altoVideo / anchoVideo);
      if (height !== altoDeseado) resizeCanvas(width, altoDeseado);

      push();
      translate(width, 0);
      scale(-1, 1);
      image(video, 0, 0, width, height);
      pop();

      if (deteccionActiva) leerPasos(anchoVideo);

      const escala = width / anchoVideo;
      const lado = 28;
      strokeWeight(4);
      textSize(16);
      for (const marca of marcas) {
        const encendido = estadoPasos[marca.paso];
        stroke(encendido ? 0 : 255);
        fill(encendido ? 255 : 0);
        rect(marca.x * escala - lado / 2, marca.y * escala - lado / 2, lado, lado);
        noStroke();
        fill(encendido ? 0 : 255);
        text(marca.paso + 1, marca.x * escala, marca.y * escala);
      }
    }

    function windowResized() {
      const contenedor = document.getElementById("lienzo");
      resizeCanvas(contenedor.clientWidth, height);
    }
  </script>
</body>
</html>
