<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>secu-manos-8-pasos</title>
  <script src="bibliotecas/p5.min.js"></script>
  <script src="bibliotecas/ml5.min.js"></script>
  <script src="bibliotecas/Tone.js"></script>
  <style>
    :root {
      --ancho: 560px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      color: #000;
      font-family: monospace;
      font-size: 16px;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: normal;
      text-transform: uppercase;
      border-bottom: 4px solid #000;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    #lienzo {
      max-width: var(--ancho);
      border: 4px solid #000;
      background: #000;
      line-height: 0;
    }

    #lienzo canvas {
      display: block;
    }

    #pasos {
      display: grid;
      grid-template-columns: minmax(7ch, auto) repeat(8, 1fr);
      gap: 4px;
      max-width: var(--ancho);
      margin-top: 8px;
    }

    #pasos button.nombre-pista {
      font: inherit;
      font-size: 12px;
      text-transform: uppercase;
      background: #fff;
      color: #000;
      border: 4px solid #000;
      padding: 0 8px;
      cursor: pointer;
    }

    #pasos button.nombre-pista[aria-pressed="true"] {
      background: #000;
      color: #fff;
      border-color: #80f;
    }

    #pasos button.paso {
      font: inherit;
      font-size: 12px;
      height: 28px;
      background: #000;
      color: #fff;
      border: 4px solid #000;
      cursor: pointer;
    }

    #pasos button.paso[aria-pressed="true"] {
      background: #fff;
      color: #000;
    }

    /* pasos en vista previa: borde punteado, encendidos en morado */
    #pasos button.paso.previa {
      border-style: dashed;
      border-color: #80f;
      background: #000;
      color: #fff;
    }

    #pasos button.paso.previa.previa-encendida {
      background: #80f;
    }

    #pasos button.paso.actual {
      border-color: #80f;
    }

    #pasos button:focus-visible,
    #controles button:focus-visible,
    #tempo:focus-visible {
      outline: 4px solid #80f;
      outline-offset: -8px;
    }

    body.con-deteccion #pasos button {
      cursor: default;
    }

    #controles {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      max-width: var(--ancho);
      margin-top: 8px;
    }

    #controles button {
      font: inherit;
      text-transform: uppercase;
      background: #000;
      color: #fff;
      border: 4px solid #000;
      padding: 4px 12px;
      cursor: pointer;
    }

    #controles button[aria-pressed="true"] {
      background: #fff;
      color: #000;
    }

    #control-tempo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    #tempo {
      appearance: none;
      width: 160px;
      height: 32px;
      background: transparent;
      cursor: pointer;
    }

    #tempo::-webkit-slider-runnable-track {
      height: 4px;
      background: #000;
    }

    #tempo::-moz-range-track {
      height: 4px;
      background: #000;
    }

    #tempo::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 32px;
      margin-top: -14px;
      background: #000;
      border: none;
      border-radius: 0;
    }

    #tempo::-moz-range-thumb {
      width: 16px;
      height: 32px;
      background: #000;
      border: none;
      border-radius: 0;
    }

    #valor-tempo {
      min-width: 8ch;
    }
  </style>
</head>
<body class="con-deteccion">
  <h1>secu-manos-8-pasos</h1>

  <div id="lienzo"></div>

  <div id="pasos"></div>

  <div id="controles">
    <button id="tocar" aria-pressed="false">tocar: no</button>
    <label id="control-tempo">
      tempo
      <input id="tempo" type="range" min="20" max="200" step="1" value="100">
      <span id="valor-tempo">100 bpm</span>
    </label>
    <button id="deteccion" aria-pressed="true">manos: sí</button>
    <p id="estado">esperando cámara</p>
  </div>

  <script>
    // modelos locales de handpose
    const opcionesManos = {
      runtime: "tfjs",
      modelType: "full",
      maxHands: 2,
      flipped: false,
      detectorModelUrl: "modelos/handpose/detector-full/model.json",
      landmarkModelUrl: "modelos/handpose/landmark-full/model.json",
    };

    // índices de keypoints de handpose para cada dedo, sin pulgar
    const dedos = [
      { nudillo: 5, medio: 6, punta: 8 },    // índice
      { nudillo: 9, medio: 10, punta: 12 },  // medio
      { nudillo: 13, medio: 14, punta: 16 }, // anular
      { nudillo: 17, medio: 18, punta: 20 }, // meñique
    ];

    // dedo extendido si (muñeca→punta) / (muñeca→medio) supera umbralSubir,
    // escondido si baja de umbralBajar; entre ambos mantiene su estado
    const umbralSubir = 1.25;
    const umbralBajar = 1.1;

    const cantidadPasos = 8;

    // tres pistas en sincronía, en el mismo orden que las franjas de la pantalla:
    // manos arriba = hihat, al medio = caja, abajo = bombo
    const pistas = [
      { nombre: "hihat", pasos: new Array(cantidadPasos).fill(false), botones: [] },
      { nombre: "caja", pasos: new Array(cantidadPasos).fill(false), botones: [] },
      { nombre: "bombo", pasos: new Array(cantidadPasos).fill(false), botones: [] },
    ];

    // pista que editan los botones cuando la detección está apagada
    let pistaActiva = 0;

    // cada mano tiene su franja; para cambiar de franja tiene que pasar
    // margenFranja (fracción del alto) más allá del borde, y edita recién
    // después de msPermanencia en la franja nueva, así al cruzar una franja
    // de camino a otra no la modifica
    const margenFranja = 0.04;
    const msPermanencia = 300;
    // distancia a la cámara según el tamaño aparente de la palma (muñeca → nudillo
    // del dedo medio, como fracción del alto del video): lejos de la cámara la mano
    // solo muestra una vista previa, cerca de la cámara reemplaza los pasos.
    // sobre umbralCerca pasa a reemplazar, bajo umbralLejos vuelve a vista previa
    const umbralCerca = 0.3;
    const umbralLejos = 0.25;

    // estado de cada mano: franja, desde cuándo está en ella, si está cerca
    // de la cámara, tamaño de la palma y sus 4 pasos en vista previa
    const franjasRanuras = [
      { pista: null, desde: 0, cerca: false, tamano: 0, previa: [] },
      { pista: null, desde: 0, cerca: false, tamano: 0, previa: [] },
    ];

    // muestras de freesound, ver sonidos/CREDITOS.md
    const archivoHihat = "sonidos/hihat-cerrado.mp3";
    const archivoBombo = "sonidos/bombo.mp3";
    const archivoCaja = "sonidos/caja.mp3";

    const contenedorPasos = document.getElementById("pasos");
    const botonDeteccion = document.getElementById("deteccion");
    const estado = document.getElementById("estado");
    const botonesNombre = [];

    let deteccionActiva = true;
    let video;
    let detectorManos;
    let manos = [];
    let marcas = [];
    let medidores = [];
    let morado;

    function seleccionarPista(indice) {
      pistaActiva = indice;
      actualizarBotones();
    }

    pistas.forEach((pista, p) => {
      const nombre = document.createElement("button");
      nombre.className = "nombre-pista";
      nombre.textContent = pista.nombre;
      nombre.addEventListener("click", () => seleccionarPista(p));
      contenedorPasos.appendChild(nombre);
      botonesNombre.push(nombre);

      for (let i = 0; i < cantidadPasos; i++) {
        const boton = document.createElement("button");
        boton.className = "paso";
        boton.textContent = i + 1;
        boton.setAttribute("aria-label", pista.nombre + " paso " + (i + 1));
        boton.addEventListener("click", () => {
          if (deteccionActiva) return;
          pista.pasos[i] = !pista.pasos[i];
          actualizarBotones();
        });
        contenedorPasos.appendChild(boton);
        pista.botones.push(boton);
      }
    });

    botonDeteccion.addEventListener("click", () => {
      deteccionActiva = !deteccionActiva;
      botonDeteccion.setAttribute("aria-pressed", String(deteccionActiva));
      botonDeteccion.textContent = deteccionActiva ? "manos: sí" : "manos: no";
      document.body.classList.toggle("con-deteccion", deteccionActiva);
      marcas = [];
      medidores = [];
      for (const franja of franjasRanuras) franja.pista = null;
      actualizarBotones();
    });

    function actualizarBotones() {
      const previas = new Map();
      franjasRanuras.forEach((franja, ranura) => {
        if (franja.pista === null || franja.editando) return;
        franja.previa.forEach((encendido, d) => previas.set(franja.pista + ":" + (ranura * 4 + d), encendido));
      });

      pistas.forEach((pista, p) => {
        const seleccionada = deteccionActiva
          ? franjasRanuras.some((franja) => franja.pista === p)
          : p === pistaActiva;
        botonesNombre[p].setAttribute("aria-pressed", String(seleccionada));
        pista.botones.forEach((boton, i) => {
          boton.setAttribute("aria-pressed", String(pista.pasos[i]));
          const clave = p + ":" + i;
          boton.classList.toggle("previa", previas.has(clave));
          boton.classList.toggle("previa-encendida", previas.get(clave) === true);
        });
      });
    }
    actualizarBotones();

    // secuenciador: recorre los pasos 1-8 en loop, un paso por corchea (8 pasos = 1 compás de 4/4)
    const botonTocar = document.getElementById("tocar");
    const deslizadorTempo = document.getElementById("tempo");
    const valorTempo = document.getElementById("valor-tempo");
    const transporte = Tone.getTransport();
    const hihat = new Tone.Player(archivoHihat).toDestination();

    const bombo = new Tone.Player(archivoBombo).toDestination();
    const caja = new Tone.Player(archivoCaja).toDestination();

    // una muestra por pista, en el mismo orden que pistas
    const muestras = [hihat, caja, bombo];

    function marcarPasoActual(pasoActual) {
      for (const pista of pistas) {
        pista.botones.forEach((boton, i) => {
          boton.classList.toggle("actual", i === pasoActual);
        });
      }
    }

    const secuencia = new Tone.Sequence((tiempo, paso) => {
      pistas.forEach((pista, p) => {
        if (pista.pasos[paso] && muestras[p].loaded) muestras[p].start(tiempo);
      });
      Tone.getDraw().schedule(() => marcarPasoActual(paso), tiempo);
    }, [0, 1, 2, 3, 4, 5, 6, 7], "8n");
    secuencia.start(0);

    transporte.bpm.value = Number(deslizadorTempo.value);

    deslizadorTempo.addEventListener("input", () => {
      const bpm = Number(deslizadorTempo.value);
      transporte.bpm.value = bpm;
      valorTempo.textContent = bpm + " bpm";
    });

    botonTocar.addEventListener("click", async () => {
      await Tone.start();
      const tocando = transporte.state !== "started";
      if (tocando) {
        transporte.start();
      } else {
        transporte.stop();
        marcarPasoActual(-1);
      }
      botonTocar.setAttribute("aria-pressed", String(tocando));
      botonTocar.textContent = tocando ? "tocar: sí" : "tocar: no";
    });

    function distancia(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // franja (pista) de una mano según su altura, con margen para no parpadear en los bordes
    function franjaDeMano(puntos, altoVideo, pistaAnterior) {
      // centro de la palma: promedio de muñeca y nudillo del dedo medio
      const altura = (puntos[0].y + puntos[9].y) / 2 / altoVideo;
      const candidata = Math.min(pistas.length - 1, Math.max(0, Math.floor(altura * pistas.length)));
      if (pistaAnterior === null || candidata === pistaAnterior) return candidata;
      const bordeArriba = pistaAnterior / pistas.length;
      const bordeAbajo = (pistaAnterior + 1) / pistas.length;
      if (altura < bordeArriba - margenFranja || altura > bordeAbajo + margenFranja) return candidata;
      return pistaAnterior;
    }

    // convierte las manos detectadas en los 8 pasos, de izquierda a derecha en pantalla;
    // la altura de cada mano elige la pista que edita
    function leerPasos(anchoVideo, altoVideo) {
      const espejo = (p) => ({ x: anchoVideo - p.x, y: p.y });
      const manosEnPantalla = manos
        .map((mano) => mano.keypoints.map(espejo))
        .sort((a, b) => a[0].x - b[0].x);

      // ranura 0 = pasos 1-4, ranura 1 = pasos 5-8
      let ranuras = [null, null];
      if (manosEnPantalla.length >= 2) {
        ranuras = [manosEnPantalla[0], manosEnPantalla[1]];
      } else if (manosEnPantalla.length === 1) {
        const puntos = manosEnPantalla[0];
        ranuras[puntos[0].x < anchoVideo / 2 ? 0 : 1] = puntos;
      }

      const ahora = performance.now();
      marcas = [];
      medidores = [];
      ranuras.forEach((puntos, ranura) => {
        const franja = franjasRanuras[ranura];
        // ranura sin mano: sus pasos quedan como estaban
        if (!puntos) {
          franja.pista = null;
          return;
        }

        const pista = franjaDeMano(puntos, altoVideo, franja.pista);
        if (pista !== franja.pista) {
          franja.pista = pista;
          franja.desde = ahora;
          // la vista previa parte desde lo que ya tiene la pista
          franja.previa = pistas[pista].pasos.slice(ranura * 4, ranura * 4 + 4);
        }

        const muneca = puntos[0];
        franja.tamano = distancia(muneca, puntos[9]) / altoVideo;
        if (franja.tamano > umbralCerca) franja.cerca = true;
        else if (franja.tamano < umbralLejos) franja.cerca = false;

        // reemplaza solo si la mano está cerca de la cámara y ya se asentó en su franja
        franja.editando = franja.cerca && ahora - franja.desde >= msPermanencia;
        const estadoPasos = pistas[pista].pasos;

        const dedosEnPantalla = [...dedos].sort((a, b) => puntos[a.nudillo].x - puntos[b.nudillo].x);
        dedosEnPantalla.forEach((dedo, d) => {
          const paso = ranura * 4 + d;
          const proporcion = distancia(muneca, puntos[dedo.punta]) / distancia(muneca, puntos[dedo.medio]);
          if (proporcion > umbralSubir) franja.previa[d] = true;
          else if (proporcion < umbralBajar) franja.previa[d] = false;
          if (franja.editando) estadoPasos[paso] = franja.previa[d];
          marcas.push({
            x: puntos[dedo.punta].x,
            y: puntos[dedo.punta].y,
            paso,
            encendido: franja.previa[d],
            editando: franja.editando,
          });
        });

        medidores.push({ x: muneca.x, y: muneca.y, tamano: franja.tamano, editando: franja.editando });
      });

      actualizarBotones();
    }

    async function setup() {
      const contenedor = document.getElementById("lienzo");
      const lienzo = createCanvas(contenedor.clientWidth, contenedor.clientWidth * 3 / 4);
      lienzo.parent(contenedor);
      textFont("monospace");
      morado = color(136, 0, 255);
      textAlign(CENTER, CENTER);

      video = createCapture(VIDEO);
      video.hide();

      estado.textContent = "cargando modelo de manos";
      try {
        detectorManos = await ml5.handPose(opcionesManos);
        detectorManos.detectStart(video, (resultados) => {
          manos = resultados;
        });
        estado.textContent = "listo";
      } catch (error) {
        estado.textContent = "error de modelo: " + error.message;
      }
    }

    function draw() {
      background(0);

      const anchoVideo = video.elt.videoWidth;
      const altoVideo = video.elt.videoHeight;
      if (!anchoVideo) return;

      const altoDeseado = Math.round(width * altoVideo / anchoVideo);
      if (height !== altoDeseado) resizeCanvas(width, altoDeseado);

      push();
      translate(width, 0);
      scale(-1, 1);
      image(video, 0, 0, width, height);
      pop();

      if (deteccionActiva) {
        leerPasos(anchoVideo, altoVideo);
        dibujarFranjas();
      }

      const escala = width / anchoVideo;
      const lado = 28;
      strokeWeight(4);
      textSize(16);
      for (const marca of marcas) {
        const encendido = marca.encendido;
        // reemplazando: blanco y negro; vista previa: morado
        if (marca.editando) {
          stroke(encendido ? 0 : 255);
          fill(encendido ? 255 : 0);
        } else {
          stroke(morado);
          fill(encendido ? morado : 0);
        }
        rect(marca.x * escala - lado / 2, marca.y * escala - lado / 2, lado, lado);
        noStroke();
        fill(marca.editando && encendido ? 0 : 255);
        text(marca.paso + 1, marca.x * escala, marca.y * escala);
      }

      // medidor de cercanía bajo cada muñeca, con marca en umbralCerca
      const anchoMedidor = 80;
      const tope = umbralCerca * 1.5;
      for (const medidor of medidores) {
        const x = medidor.x * escala - anchoMedidor / 2;
        const y = medidor.y * escala + 16;
        noStroke();
        fill(0);
        rect(x, y, anchoMedidor, 12);
        fill(medidor.editando ? 255 : morado);
        rect(x, y, anchoMedidor * Math.min(1, medidor.tamano / tope), 12);
        stroke(255);
        strokeWeight(2);
        const xUmbral = x + anchoMedidor * umbralCerca / tope;
        line(xUmbral, y - 4, xUmbral, y + 16);
      }
    }

    // líneas entre franjas y el nombre de cada pista a la izquierda
    function dibujarFranjas() {
      const altoFranja = height / pistas.length;
      stroke(255);
      strokeWeight(2);
      for (let p = 1; p < pistas.length; p++) {
        line(0, p * altoFranja, width, p * altoFranja);
      }

      textSize(12);
      textAlign(LEFT, CENTER);
      pistas.forEach((pista, p) => {
        const conMano = franjasRanuras.some((franja) => franja.pista === p);
        const etiqueta = pista.nombre;
        noStroke();
        fill(conMano ? morado : 0);
        rect(0, p * altoFranja, textWidth(etiqueta) + 16, 24);
        fill(255);
        text(etiqueta, 8, p * altoFranja + 12);
      });
      textAlign(CENTER, CENTER);
    }

    function windowResized() {
      const contenedor = document.getElementById("lienzo");
      resizeCanvas(contenedor.clientWidth, height);
    }
  </script>
</body>
</html>
